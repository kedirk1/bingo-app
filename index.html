<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigat Gashena Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 12px;
            gap: 5px;
        }
        .badge {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 8px 6px;
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            flex: 1;
        }
        .badge.room { background-color: #f1c40f; color: #000; border: none; }
        .badge.balance { background-color: #27ae60; color: #fff; border: none; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 400px;
            background: #181818;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #2c2c2c;
            max-height: 360px;
            overflow-y: auto;
        }
        .number-cell {
            background-color: #e2e8f0;
            color: #1e293b;
            padding: 8px 0;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: 0.1s;
        }
        .number-cell:hover {
            background-color: #cbd5e1;
        }
        .number-cell.selected {
            background-color: #f97316;
            color: white;
            transform: scale(1.05);
        }

        .slots-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            gap: 10px;
        }
        .slot {
            flex: 1;
            border: 2px dashed #475569;
            border-radius: 10px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 11px;
            background: #1e1e1e;
        }
        .slot.filled {
            border: 2px solid #27ae60;
            color: #27ae60;
            font-weight: bold;
            background: rgba(39, 174, 96, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge room">ROOM<br>💎 VIP 💎</div>
        <div class="badge">SOLD<br><span id="sold-count">0</span></div>
        <div class="badge">TIME<br><span id="timer">60s</span></div>
        <div class="badge balance">BALANCE<br>0.00 ETB</div>
    </div>

    <div class="grid-container" id="number-grid">
        <!-- Numbers 1 to 300 generated via JS -->
    </div>

    <div class="slots-section">
        <div class="slot" id="slot-1">+<br>SLOT 1 EMPTY</div>
        <div class="slot" id="slot-2">+<br>SLOT 2 EMPTY</div>
    </div>

    <script>
        const grid = document.getElementById('number-grid');
        const slot1 = document.getElementById('slot-1');
        const slot2 = document.getElementById('slot-2');
        const soldCountSpan = document.getElementById('sold-count');
        const timerSpan = document.getElementById('timer');
        
        let selectedNumbers = [];
        let currentSold = 0;
        let timeLeft = 60;

        // Auto increment sold count from 0
        setInterval(() => {
            if (currentSold < 290 && Math.random() > 0.4) {
                currentSold += Math.floor(Math.random() * 3) + 1;
                soldCountSpan.textContent = currentSold;
            }
        }, 3000);

        // Countdown timer
        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 60;
            }
            timerSpan.textContent = timeLeft + 's';
        }, 1000);

        // Generate numbers 1 to 300 fully active and clickable
        for (let i = 1; i <= 300; i++) {
            const cell = document.createElement('div');
            cell.classList.add('number-cell');
            cell.textContent = i;
            
            cell.addEventListener('click', () => {
                if (cell.classList.contains('selected')) {
                    cell.classList.remove('selected');
                    selectedNumbers = selectedNumbers.filter(num => num !== i);
                } else {
                    if (selectedNumbers.length < 2) {
                        cell.classList.add('selected');
                        selectedNumbers.push(i);
                    } else {
                        alert('ሁለት ካርቴላዎች ብቻ መምረጥ ይችላሉ!');
                    }
                }
                updateSlots();
            });
            grid.appendChild(cell);
        }

        function updateSlots() {
            if (selectedNumbers.length > 0) {
                slot1.innerHTML = `ካርቴላ #${selectedNumbers[0]}`;
                slot1.classList.add('filled');
            } else {
                slot1.innerHTML = `+<br>SLOT 1 EMPTY`;
                slot1.classList.remove('filled');
            }

            if (selectedNumbers.length > 1) {
                slot2.innerHTML = `ካርቴላ #${selectedNumbers[1]}`;
                slot2.classList.add('filled');
            } else {
                slot2.innerHTML = `+<br>SLOT 2 EMPTY`;
                slot2.classList.remove('filled');
            }
        }
    </script>
</body>
</html>
