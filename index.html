<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigat Gashena Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            gap: 5px;
        }
        .badge {
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.room { background-color: #f1c40f; color: #000; }
        .badge.balance { background-color: #27ae60; color: #fff; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 400px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            max-height: 350px;
            overflow-y: auto;
        }
        .number-cell {
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 10px 0;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .number-cell.selected {
            background-color: #e67e22;
            color: white;
        }
        .number-cell.disabled {
            background-color: #7f8c8d;
            color: #bdc3c7;
            cursor: not-allowed;
        }

        .slots-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            gap: 10px;
        }
        .slot {
            flex: 1;
            border: 2px dashed #7f8c8d;
            border-radius: 12px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 12px;
            background: #222;
        }
        .slot.filled {
            border: 2px solid #27ae60;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge room">ROOM<br>💎 VIP 💎</div>
        <div class="badge">SOLD<br><span id="sold-count">29</span></div>
        <div class="badge">TIME<br><span id="timer">27s</span></div>
        <div class="badge balance">BALANCE<br>0.00 ETB</div>
    </div>

    <div class="grid-container" id="number-grid">
        <!-- Numbers 1 to 96 generated via JS -->
    </div>

    <div class="slots-section">
        <div class="slot" id="slot-1">+<br>SLOT 1 EMPTY</div>
        <div class="slot" id="slot-2">+<br>SLOT 2 EMPTY</div>
    </div>

    <script>
        const grid = document.getElementById('number-grid');
        const slot1 = document.getElementById('slot-1');
        const slot2 = document.getElementById('slot-2');
        
        let selectedNumbers = [];

        // Generate numbers 1 to 96
        for (let i = 1; i <= 96; i++) {
            const cell = document.createElement('div');
            cell.classList.add('number-cell');
            cell.textContent = i;
            
            if ([3, 12, 19, 28, 35, 45, 66, 73, 83, 88].includes(i)) {
                cell.classList.add('disabled');
            } else {
                cell.addEventListener('click', () => {
                    if (cell.classList.contains('selected')) {
                        cell.classList.remove('selected');
                        selectedNumbers = selectedNumbers.filter(num => num !== i);
                    } else {
                        if (selectedNumbers.length < 2) {
                            cell.classList.add('selected');
                            selectedNumbers.push(i);
                        } else {
                            alert('ሁለት ካርቴላዎች ብቻ መምረጥ ይችላሉ!');
                        }
                    }
                    updateSlots();
                });
            }
            grid.appendChild(cell);
        }

        function updateSlots() {
            if (selectedNumbers.length > 0) {
                slot1.innerHTML = `ካርቴላ #${selectedNumbers[0]}`;
                slot1.classList.add('filled');
            } else {
                slot1.innerHTML = `+<br>SLOT 1 EMPTY`;
                slot1.classList.remove('filled');
            }

            if (selectedNumbers.length > 1) {
                slot2.innerHTML = `ካርቴላ #${selectedNumbers[1]}`;
                slot2.classList.add('filled');
            } else {
                slot2.innerHTML = `+<br>SLOT 2 EMPTY`;
                slot2.classList.remove('filled');
            }
        }
    </script>
</body>
</html>
